name: Build and deploy ASP.Net Core app to Azure Web App - FootballAnalysis

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore FootballAnalysis.Solution/FootballAnalysis.API/FootballAnalysis.API.csproj

      - name: Build
        run: dotnet build FootballAnalysis.Solution/FootballAnalysis.API/FootballAnalysis.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish FootballAnalysis.Solution/FootballAnalysis.API/FootballAnalysis.API.csproj --configuration Release --no-restore --output "${{ env.DOTNET_ROOT }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FootballAnalysis'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.__publishingprofilesecretname__ }}
